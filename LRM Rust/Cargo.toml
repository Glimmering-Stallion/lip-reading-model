[package]
name = "lrm_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.18.0", features = ["ndarray"] }
burn-autodiff = "0.18"
burn-ndarray = "0.18.0"
burn-train = "0.18.0"
image = "0.25.8" # for image processing
ndarray = "0.16.1"
num-traits = "0.2.19"
opencv = "0.96.0" # for CV tasks
rand = "0.9.2"
clap = { version = "4.5.48", features = ["derive"] } # for terminal arg parsing
reqwest = { version = "0.12.23", features = ["blocking"] } # for HTTP requests to download data
serde = { version = "1.0.228", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
zip = "5.1.1"
flate2 = "1.1.2"
serde_json = "1.0.145"
tar = "0.4.44"
indicatif = "0.18.3"

